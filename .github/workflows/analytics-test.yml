name: YouTube Analytics API Test

on:
  workflow_dispatch:

  schedule:
    # 毎日 JST 12:00
    # UTC 03:00
    - cron: "00 3 * * *"

permissions:
  contents: write

jobs:
  test-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test YouTube Analytics API
        env:
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: python analytics/update_analytics.py

      - name: Test YouTube Reporting API
        env:
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
        run: python analytics/reporting_setup.py
        
      - name: Commit analytics data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analytics/analytics_data.json

          [ -f analytics/reporting_job.json ] && git add analytics/reporting_job.json
          [ -f analytics/reporting_reports.json ] && git add analytics/reporting_reports.json
          [ -f analytics/reach_report.csv ] && git add analytics/reach_report.csv
          [ -f analytics/reach_report.json ] && git add analytics/reach_report.json

          if git diff --cached --quiet; then
            echo "No analytics changes"
          else
            git commit -m "Update YouTube analytics data"
            git push
          fi
