<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#EFEAE3"
  >

  <title>
    Creative desk | #切り抜くぞニアジョイ
  </title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <link
    rel="stylesheet"
    href="creative.css"
  >

</head>


<body>

  <div id="globalHeader"></div>


  <main class="creative-page">




    <section class="stream-clips-section">

      <div class="creative-section-head">

        <div>
          <div class="section-kicker">
            STREAM CLIPS
          </div>

          <h2>
            配信素材
          </h2>
        </div>

        <div
          class="stream-new-count"
          id="streamNewCount"
          hidden
        >
          新着 0件
        </div>

      </div>


      <div
        class="stream-clips-list"
        id="streamClipsList"
      ></div>


      <div
        class="stream-empty"
        id="streamEmpty"
      >
        新しい配信はありません
      </div>


      <button
        class="stream-reviewed-toggle"
        id="streamReviewedToggle"
        type="button"
      >
        確認済みを表示
      </button>


      <div
        class="stream-reviewed-list"
        id="streamReviewedList"
        hidden
      ></div>

    </section>


    <!-- =========================
         POSTING CALENDAR
    ========================== -->

    <section class="posting-calendar-section">

      <div class="creative-section-head calendar-section-heading">

        <div>

          <div class="section-kicker">
            POSTING CALENDAR
          </div>

          <h2>
            投稿カレンダー
          </h2>

        </div>


        <div class="calendar-controls">

          <button
            id="prevMonth"
            class="calendar-arrow"
            type="button"
            aria-label="前の月"
          >
            ‹
          </button>

          <strong id="calendarMonthLabel">
            —
          </strong>

          <button
            id="nextMonth"
            class="calendar-arrow"
            type="button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>

      </div>


      <div class="posting-summary">

        <article>

          <span>
            直近10本の平均間隔
          </span>

          <strong id="recentPostInterval">
            —
          </strong>

          <small>
            日
          </small>

        </article>


        <article>

          <span>
            全期間の平均間隔
          </span>

          <strong id="allPostInterval">
            —
          </strong>

          <small>
            日
          </small>

        </article>


        <article class="recommended">

          <span>
            次回おすすめ
          </span>

          <strong id="recommendedWindow">
            —
          </strong>

        </article>

      </div>


      <article class="calendar-card">

        <div class="calendar-weekdays">

          <span>日</span>
          <span>月</span>
          <span>火</span>
          <span>水</span>
          <span>木</span>
          <span>金</span>
          <span>土</span>

        </div>


        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>

      </article>


      <div class="calendar-legend">

        <span>

          <i class="legend-recommended"></i>

          おすすめ投稿日

        </span>

        <span>

          <i class="legend-posted"></i>

          投稿日

        </span>

      </div>

    </section>


    <section class="joy-schedule-section">

      <div class="creative-section-head schedule-section-head">

        <div>
          <div class="section-kicker">
            ≒JOY SCHEDULE
          </div>

          <h2>
            スケジュール
          </h2>
        </div>

        <div class="schedule-month-nav">

          <button
            class="schedule-month-btn"
            id="schedulePrevMonth"
            type="button"
            aria-label="前の月"
          >
            ‹
          </button>

          <strong
            class="schedule-month-title"
            id="scheduleMonthTitle"
          ></strong>

          <button
            class="schedule-month-btn"
            id="scheduleNextMonth"
            type="button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>

      </div>



      <div class="schedule-calendar-wrap">

        <div class="schedule-calendar-card">

          <div class="schedule-weekdays">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
          </div>

          <div
            class="schedule-calendar-grid"
            id="scheduleCalendarGrid"
          ></div>

        </div>

        <div
          class="schedule-detail-overlay"
          id="scheduleDetailOverlay"
          hidden
        >

          <div
            class="schedule-detail"
            id="scheduleDetail"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <script src="../common.js"></script>
  <script src="creative.js"></script>

</body>

</html>
