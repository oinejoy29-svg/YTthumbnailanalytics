<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#EFEAE3"
  >

  <title>
    Creative desk | #切り抜くぞニアジョイ
  </title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <link
    rel="stylesheet"
    href="creative.css"
  >

</head>


<body>

  <div id="globalHeader"></div>


  <main class="creative-page">

    <section class="creative-hero">

      <div class="section-kicker">
        CREATIVE DESK
      </div>

      <h2>
        Creative desk
      </h2>

    </section>


    <section class="stream-clips-section">

      <div class="creative-section-head">

        <div>
          <div class="section-kicker">
            STREAM CLIPS
          </div>

          <h3>
            配信切り抜き
          </h3>
        </div>

        <div
          class="stream-new-count"
          id="streamNewCount"
          hidden
        >
          新着 0件
        </div>

      </div>


      <div
        class="stream-clips-list"
        id="streamClipsList"
      ></div>


      <div
        class="stream-empty"
        id="streamEmpty"
      >
        新しい配信はありません
      </div>


      <button
        class="stream-reviewed-toggle"
        id="streamReviewedToggle"
        type="button"
      >
        確認済みを表示
      </button>


      <div
        class="stream-reviewed-list"
        id="streamReviewedList"
        hidden
      ></div>

    </section>

  </main>


  <script src="../common.js"></script>
  <script src="creative.js"></script>

</body>

</html>
