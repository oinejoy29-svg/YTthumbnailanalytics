<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#EFEAE3"
  >

  <title>
    Creative desk | #切り抜くぞニアジョイ
  </title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <link
    rel="stylesheet"
    href="creative.css"
  >

</head>


<body>

  <div id="globalHeader"></div>


  <main class="creative-page">

    <section class="creative-hero">

      <div class="section-kicker">
        CREATIVE DESK
      </div>

      <h2>
        Creative desk
      </h2>

    </section>


    <section class="stream-clips-section">

      <div class="creative-section-head">

        <div>
          <div class="section-kicker">
            STREAM CLIPS
          </div>

          <h3>
            配信切り抜き
          </h3>
        </div>

        <div
          class="stream-new-count"
          id="streamNewCount"
          hidden
        >
          新着 0件
        </div>

      </div>


      <div
        class="stream-clips-list"
        id="streamClipsList"
      ></div>


      <div
        class="stream-empty"
        id="streamEmpty"
      >
        新しい配信はありません
      </div>


      <button
        class="stream-reviewed-toggle"
        id="streamReviewedToggle"
        type="button"
      >
        確認済みを表示
      </button>


      <div
        class="stream-reviewed-list"
        id="streamReviewedList"
        hidden
      ></div>

    </section>
    
    <section class="joy-schedule-section">

      <div class="creative-section-head schedule-section-head">

        <div>
          <div class="section-kicker">
            ≒JOY SCHEDULE
          </div>

          <h3>
            スケジュール
          </h3>
        </div>

        <div class="schedule-month-nav">

          <button
            class="schedule-month-btn"
            id="schedulePrevMonth"
            type="button"
            aria-label="前の月"
          >
            ‹
          </button>

          <strong
            class="schedule-month-title"
            id="scheduleMonthTitle"
          ></strong>

          <button
            class="schedule-month-btn"
            id="scheduleNextMonth"
            type="button"
            aria-label="次の月"
          >
            ›
          </button>

        </div>

      </div>



      <div class="schedule-calendar-wrap">

        <div class="schedule-calendar-card">

          <div class="schedule-weekdays">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
          </div>

          <div
            class="schedule-calendar-grid"
            id="scheduleCalendarGrid"
          ></div>

        </div>

        <div
          class="schedule-detail-overlay"
          id="scheduleDetailOverlay"
          hidden
        >

          <div
            class="schedule-detail"
            id="scheduleDetail"
          ></div>

        </div>

      </div>

    </section>

  </main>


  <script src="../common.js"></script>
  <script src="creative.js"></script>

</body>

</html>
